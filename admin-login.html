<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication | MoSPI Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="center-body dark-bg">
    <div class="login-card">
        <div class="icon-box admin-icon"><i class="fa-solid fa-user-shield"></i></div>
        <h2>Admin Authentication</h2>
        <p class="subtitle">MoSPI Command Center Access</p>

        <div style="background: rgba(30, 58, 138, 0.25); border: 1px solid #3b82f6; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; font-size: 0.8rem; color: #93c5fd; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa-solid fa-key" style="color: #60a5fa; font-size: 0.9rem;"></i>
            <span><strong>Admin Access:</strong> <code style="background: #1e293b; padding: 2px 6px; border-radius: 4px; border: 1px solid #475569; color: #38bdf8;">admin@mospi.gov.in</code> / <code style="background: #1e293b; padding: 2px 6px; border-radius: 4px; border: 1px solid #475569; color: #38bdf8;">1234</code></span>
        </div>

        <form id="adminForm" onsubmit="event.preventDefault(); submitAdminAuth(event);">
            <div class="form-group">
                <label>Admin Email ID</label>
                <input type="email" id="email" value="admin@mospi.gov.in" placeholder="Enter admin email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="1234" placeholder="Enter password" required>
            </div>
            <button type="submit" id="btnAdminSubmit" class="btn-submit admin-btn"><i class="fa-solid fa-lock"></i> Authorize & Access Portal</button>
        </form>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>

    <script>
        function submitAdminAuth(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('btnAdminSubmit') || document.querySelector('button[type="submit"]');

            const email = (emailInput && emailInput.value && emailInput.value.trim()) ? emailInput.value.trim() : 'admin@mospi.gov.in';

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authorizing Portal...';
            }

            const adminUser = {
                name: 'MoSPI Training Administrator',
                email: email,
                role: 'admin',
                department: 'National Statistical Systems Training Academy (NSSTA)',
                designation: 'Joint Director / Chief Training Officer',
                cadre: 'Indian Statistical Service (ISS)',
                session_token: 'GOV-ADMIN-TOKEN-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now(),
                session_expiry: new Date(Date.now() + 86400000 * 7).toISOString(),
                login_timestamp: new Date().toISOString()
            };

            const serialized = JSON.stringify(adminUser);
            try {
                localStorage.setItem('mospi_user', serialized);
                sessionStorage.setItem('mospi_user', serialized);
            } catch (e) {
                console.warn("Storage error:", e);
            }

            const apiUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:5000'
                : 'https://sih100-backend.onrender.com';

            try {
                fetch(apiUrl + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: '1234', role: 'admin' })
                }).catch(() => {});
            } catch (err) {}

            // Guaranteed immediate redirect to admin.html
            try {
                window.location.href = 'admin.html';
            } catch (e) {
                window.location.assign('admin.html');
            }
            setTimeout(() => {
                window.location.replace('admin.html');
            }, 50);

            return false;
        }

        window.submitAdminAuth = submitAdminAuth;
        window.handleAdminLogin = submitAdminAuth;
        window.submitAuth = function(role, e) { return submitAdminAuth(e); };
    </script>
    <script src="auth.js?v=3.1"></script>
</body>
</html>
