<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication | MoSPI Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="center-body dark-bg">
    <div class="login-card">
        <div class="icon-box admin-icon"><i class="fa-solid fa-user-shield"></i></div>
        <h2>Admin Authentication</h2>
        <p class="subtitle">MoSPI Command Center Access</p>
        <form id="adminForm">
            <div class="form-group">
                <label>Admin Email ID</label>
                <input type="email" id="email" placeholder="Enter admin email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit admin-btn"><i class="fa-solid fa-lock"></i> Authorize & Access Portal</button>
        </form>
        <div style="margin: 14px 0 10px 0; text-align: center; font-size: 0.8rem; color: #94a3b8; font-weight: 700;">— OR USE OFFICIAL SSO —</div>
        <button type="button" class="btn-submit sso-btn" id="btn-parichay-sso" onclick="triggerGovSSO('admin')" style="background:#059669; margin-bottom:12px;"><i class="fa-solid fa-shield-halved"></i> Sign In with Parichay (Gov SSO)</button>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>
    <script src="auth.js"></script>
</body>
</html>
