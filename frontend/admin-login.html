<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication | MoSPI Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="center-body dark-bg">
    <div class="login-card">
        <div class="icon-box admin-icon"><i class="fa-solid fa-user-shield"></i></div>
        <h2>Admin Authentication</h2>
        <p class="subtitle">MoSPI Command Center Access</p>
        <form id="adminForm">
            <div class="form-group">
                <label>Admin Email ID</label>
                <input type="email" id="email" placeholder="e.g. admin@mospi.gov.in" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit admin-btn"><i class="fa-solid fa-lock"></i> Authorize & Access Portal</button>
        </form>

        <div style="margin: 18px 0; display: flex; align-items: center; text-align: center; color: #94a3b8; font-size: 0.78rem; font-weight: 700;">
            <hr style="flex: 1; border: none; border-top: 1px solid #334155;">
            <span style="padding: 0 10px; text-transform: uppercase; letter-spacing: 0.5px;">Or Authorize via Parichay</span>
            <hr style="flex: 1; border: none; border-top: 1px solid #334155;">
        </div>

        <button type="button" onclick="triggerGovAdminSSO()" class="btn-submit" style="background: linear-gradient(135deg, #1e3a8a, #0284c7); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.88rem; padding: 10px 14px; margin-bottom: 14px;">
            <i class="fa-solid fa-shield-halved" style="color: #f59e0b;"></i> Authenticate via Parichay (MeriPehchan SSO)
        </button>

        <div style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-lock" style="color: #38bdf8; font-size: 0.9rem;"></i>
            <span><strong>CERT-In & DPDP Act 2023 Compliant</strong> • Admin Clearance Level 3</span>
        </div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>
    <script src="auth.js"></script>
</body>
</html>
