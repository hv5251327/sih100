<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | MoSPI Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .dashboard-container {
            max-width: 900px;
            margin: 3rem auto;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .profile-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1.2rem;
            border-radius: 10px;
        }
        .profile-card label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .profile-card span {
            font-size: 1.05rem;
            color: #1e293b;
            font-weight: 600;
        }
        .btn-logout {
            background: #e11d48;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body class="center-body">
    <div class="dashboard-container">
        <div class="header-bar">
            <div>
                <h2 style="color: #234374; margin-bottom: 0.2rem;">Employee Competency Profile</h2>
                <p style="color: #64748b; font-size: 0.9rem;">National Statistical System Portal</p>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <div class="profile-grid">
            <div class="profile-card">
                <label>Officer Name</label>
                <span id="userName">-</span>
            </div>
            <div class="profile-card">
                <label>Official Email</label>
                <span id="userEmail">-</span>
            </div>
            <div class="profile-card">
                <label>Statistical Cadre</label>
                <span id="userCadre">-</span>
            </div>
            <div class="profile-card">
                <label>Division / Department</label>
                <span id="userDept">-</span>
            </div>
            <div class="profile-card" style="grid-column: 1 / -1;">
                <label>Designation</label>
                <span id="userDesignation">-</span>
            </div>
        </div>
    </div>

    <script>
        const sessionUser = localStorage.getItem('mospi_user');
        if (!sessionUser) {
            window.location.href = 'employee-login.html';
        } else {
            const user = JSON.parse(sessionUser);
            document.getElementById('userName').innerText = user.name || 'N/A';
            document.getElementById('userEmail').innerText = user.email || 'N/A';
            document.getElementById('userCadre').innerText = user.cadre || 'N/A';
            document.getElementById('userDept').innerText = user.department || 'N/A';
            document.getElementById('userDesignation').innerText = user.designation || 'N/A';
        }

        function logout() {
            localStorage.removeItem('mospi_user');
            window.location.href = 'employee-login.html';
        }
    </script>
</body>
</html>
