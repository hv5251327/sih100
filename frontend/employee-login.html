<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login | MoSPI Competency Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="center-body">
    <div class="login-card">
        <div class="icon-box"><i class="fa-solid fa-graduation-cap"></i></div>
        <h2>MoSPI Competency Portal</h2>
        <p class="subtitle">Employee Login</p>
        <form id="employeeForm">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <div style="margin: 12px 0 8px 0; text-align: center; font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">— OR USE OFFICIAL SSO —</div>
        <button type="button" class="btn-submit sso-btn" id="btn-parichay-sso" onclick="triggerGovSSO('employee')" style="background:#059669; margin-bottom:10px;"><i class="fa-solid fa-shield-halved"></i> Sign In with Parichay (Gov SSO)</button>
        <p class="footer-text">New Employee? <a href="register.html">Register here</a></p>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>
    <script src="auth.js"></script>
</body>
</html>
