<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration | MoSPI Competency Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .register-container {
            max-width: 650px;
            margin: 2rem auto;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .register-container h2 {
            color: #234374;
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
            text-align: center;
        }
        .register-container .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: #ffffff;
            color: #1e293b;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #234374;
        }
        .btn-register-submit {
            width: 100%;
            padding: 0.85rem;
            background: #c4823f;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .btn-register-submit:hover {
            background: #a46114;
        }
    </style>
</head>
<body class="center-body">
    <div class="register-container">
        <div class="icon-box" style="text-align: center;"><i class="fa-solid fa-id-card"></i></div>
        <h2>MoSPI Employee Registration</h2>
        <p class="subtitle">National Statistical System Capacity Building Portal</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter full name" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Official Email ID</label>
                    <input type="email" id="regEmail" placeholder="Enter official email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Enter password" required>
                </div>
            </div>

            <div class="form-group">
                <label>Statistical Cadre</label>
                <select id="regCadre" required onchange="handleCadreChange()">
                    <option value="">-- Loading Cadres... --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Division / Department / Organization</label>
                <select id="regDept" required onchange="handleDeptChange()">
                    <option value="">-- Select Cadre First --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Designation</label>
                <select id="regDesignation" required>
                    <option value="">-- Select Department First --</option>
                </select>
            </div>

            <button type="submit" class="btn-register-submit">Register & Create Competency Profile</button>
        </form>

        <p class="footer-text" style="text-align: center; margin-top: 1.2rem;">
            Already registered? <a href="employee-login.html">Employee Login</a>
        </p>
        <div style="text-align: center;">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://sih100-backend.onrender.com';
        const SUPABASE_URL = 'https://ccdrahlnsfrncsqaiumt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjZHJhaGxuc2ZybmNzcWFpdW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDEzMDAsImV4cCI6MjEwMzU3NzMwMH0.O3sAoWJuLWKeJCenkiUjen3FfLnNahUu7nKbpQ1t6Fo';

        let metadataList = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadMetadata();
        });

        async function loadMetadata() {
            try {
                // Try fetching from backend API first
                const res = await fetch(`${API_URL}/api/metadata`);
                if (res.ok) {
                    metadataList = await res.json();
                }
            } catch (err) {
                console.warn("Backend API unavailable, querying Supabase directly...", err);
            }

            // Fallback direct to Supabase if backend was idle/failed
            if (!metadataList || metadataList.length === 0) {
                try {
                    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data, error } = await sb.from('mospi_metadata').select('cadre, department_code, department_name, designation');
                    if (!error && data) {
                        metadataList = data;
                    }
                } catch (sbErr) {
                    console.error("Direct Supabase query error:", sbErr);
                }
            }

            const cadreSelect = document.getElementById('regCadre');
            if (!metadataList || metadataList.length === 0) {
                cadreSelect.innerHTML = '<option value="">-- Unable to load cadres from DB --</option>';
                return;
            }

            const uniqueCadres = [...new Set(metadataList.map(item => item.cadre))];
            cadreSelect.innerHTML = '<option value="">-- Select Cadre --</option>';
            uniqueCadres.forEach(cadre => {
                const opt = document.createElement('option');
                opt.value = cadre;
                opt.textContent = cadre;
                cadreSelect.appendChild(opt);
            });
        }

        function handleCadreChange() {
            const selectedCadre = document.getElementById('regCadre').value;
            const deptSelect = document.getElementById('regDept');
            const desigSelect = document.getElementById('regDesignation');

            deptSelect.innerHTML = '<option value="">-- Select Division / Department --</option>';
            desigSelect.innerHTML = '<option value="">-- Select Department First --</option>';

            if (!selectedCadre) return;

            const filteredDepts = metadataList.filter(item => item.cadre === selectedCadre);
            const uniqueDepts = [];
            const seenCodes = new Set();

            filteredDepts.forEach(item => {
                if (!seenCodes.has(item.department_code)) {
                    seenCodes.add(item.department_code);
                    uniqueDepts.push({ code: item.department_code, name: item.department_name });
                }
            });

            uniqueDepts.forEach(dept => {
                const opt = document.createElement('option');
                opt.value = dept.code;
                opt.textContent = dept.name;
                deptSelect.appendChild(opt);
            });
        }

        function handleDeptChange() {
            const selectedCadre = document.getElementById('regCadre').value;
            const selectedDept = document.getElementById('regDept').value;
            const desigSelect = document.getElementById('regDesignation');

            desigSelect.innerHTML = '<option value="">-- Select Designation --</option>';

            if (!selectedDept) return;

            const filteredDesigs = metadataList.filter(item => item.cadre === selectedCadre && item.department_code === selectedDept);
            const uniqueDesigs = [...new Set(filteredDesigs.map(item => item.designation))];

            uniqueDesigs.forEach(role => {
                const opt = document.createElement('option');
                opt.value = role;
                opt.textContent = role;
                desigSelect.appendChild(opt);
            });
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
