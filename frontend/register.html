<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration | MoSPI Competency Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border, #cbd5e1);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: var(--text-main, #0f172a);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }
        .form-group select:focus {
            border-color: var(--primary, #1e3a8a);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
        }
    </style>
</head>
<body class="center-body">
    <div class="login-card" style="max-width: 580px; width: 100%;">
        <div class="icon-box"><i class="fa-solid fa-user-plus"></i></div>
        <h2>MoSPI Competency Portal</h2>
        <p class="subtitle">Employee Registration</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Officer Full Name</label>
                <input type="text" id="regName" placeholder="e.g. Dr. Sunita Sharma" required>
            </div>

            <div class="form-group">
                <label>Official Government Email ID</label>
                <input type="email" id="regEmail" placeholder="e.g. sunita.sharma@mospi.gov.in" required>
            </div>

            <div class="form-group">
                <label>Account Password</label>
                <input type="password" id="regPassword" placeholder="Create a secure password (e.g. mospi123)" required>
            </div>

            <div class="form-group">
                <label>Statistical Cadre</label>
                <select id="regCadre" required>
                    <option value="">-- Select Cadre --</option>
                    <option value="Indian Statistical Service (ISS)">Indian Statistical Service (ISS) — Group 'A' Central Service</option>
                    <option value="Subordinate Statistical Service (SSS)">Subordinate Statistical Service (SSS) — Group 'B' Central Service</option>
                    <option value="State DES Cadre">State Directorate of Economics & Statistics (DES) Cadre</option>
                </select>
            </div>

            <div class="form-group">
                <label>Division / Department / Organization</label>
                <select id="regDept" required onchange="handleDeptChange()">
                    <option value="">-- Select Division / Department --</option>
                    <option value="NAD">National Accounts Division (NAD) — Macro Aggregates & GDP</option>
                    <option value="ESD">Economic Statistics Division (ESD) — IIP & ASI</option>
                    <option value="PSD">Price Statistics Division (PSD) — CPI & Inflation</option>
                    <option value="SSD">Social Statistics Division (SSD) — SDG Metrics</option>
                    <option value="FOD">Field Operations Division (FOD) — Primary Field Surveys</option>
                    <option value="SDRD">Survey Design and Research Division (SDRD) — Sampling Design</option>
                    <option value="DPD">Data Processing Division (DPD) — Validation & Tabulation</option>
                    <option value="DIID">Data Informatics & Innovation Division (DIID) — Cloud & AI</option>
                    <option value="NSSTA">National Statistical Systems Training Academy (NSSTA) — Training HQ</option>
                    <option value="CAPD">Coordination & Publication Division (CAPD)</option>
                    <option value="NSSO">National Sample Survey Office Secretariat (NSSO HQs)</option>
                    <option value="IPMD">Infrastructure & Project Monitoring Division (IPMD)</option>
                    <option value="SDG_LAB">Sustainable Development Goals (SDG) Unit / Data Innovation Lab</option>
                    <option value="STATE_DES">State Directorate of Economics and Statistics (State DES) — State HQ</option>
                    <option value="DSO">District Statistical Office (DSO) — Field Unit</option>
                    <option value="TALUK">State Sub-Divisional / Taluk Statistical Unit</option>
                </select>
            </div>

            <div class="form-group">
                <label>Designation</label>
                <select id="regDesignation" required>
                    <option value="">-- Select Designation --</option>
                    <option value="Director General (DG)">Director General (DG)</option>
                    <option value="Additional Director General (ADG)">Additional Director General (ADG)</option>
                    <option value="Deputy Director General (DDG)">Deputy Director General (DDG)</option>
                    <option value="Director / Joint Director">Director / Joint Director</option>
                    <option value="Deputy Director / Assistant Director">Deputy Director / Assistant Director</option>
                    <option value="Senior Statistical Officer (SSO)">Senior Statistical Officer (SSO)</option>
                    <option value="Junior Statistical Officer (JSO)">Junior Statistical Officer (JSO)</option>
                    <option value="Deputy Director General (DDG / Regional Head)">Deputy Director General (DDG / Regional Head)</option>
                    <option value="Senior Statistical Officer (SSO / Field Supervisor)">Senior Statistical Officer (SSO / Field Supervisor)</option>
                    <option value="Junior Statistical Officer (JSO / Field Investigator)">Junior Statistical Officer (JSO / Field Investigator)</option>
                    <option value="Additional Director General (ADG / Head of Academy)">Additional Director General (ADG / Head of Academy)</option>
                    <option value="Director / Joint Director (Faculty)">Director / Joint Director (Faculty)</option>
                    <option value="Deputy Director / Assistant Director (Course Coordinator)">Deputy Director / Assistant Director (Course Coordinator)</option>
                    <option value="ISS Probationer / Officer Trainee (NSSTA)">ISS Probationer / Officer Trainee (NSSTA)</option>
                    <option value="Director / Commissioner of Economics & Statistics (State Head)">Director / Commissioner of Economics & Statistics (State Head)</option>
                    <option value="Joint Director / Deputy Director (State DES)">Joint Director / Deputy Director (State DES)</option>
                    <option value="Assistant Statistical Officer / Statistical Officer (State)">Assistant Statistical Officer / Statistical Officer (State)</option>
                    <option value="Statistical Inspector / Research Assistant (DES)">Statistical Inspector / Research Assistant (DES)</option>
                    <option value="District Statistical Officer (DSO)">District Statistical Officer (DSO)</option>
                    <option value="Assistant Statistical Officer (ASO)">Assistant Statistical Officer (ASO)</option>
                    <option value="Primary Field Investigator / Enumerator">Primary Field Investigator / Enumerator</option>
                    <option value="Sub-Divisional / Taluk Statistical Officer">Sub-Divisional / Taluk Statistical Officer</option>
                    <option value="Statistical Compiler / Computer Operator">Statistical Compiler / Computer Operator</option>
                    <option value="Director">Director</option>
                    <option value="Joint Director">Joint Director</option>
                    <option value="Deputy Director">Deputy Director</option>
                    <option value="Assistant Director">Assistant Director</option>
                    <option value="Senior Statistical Officer">Senior Statistical Officer</option>
                    <option value="Junior Statistical Officer">Junior Statistical Officer</option>
                    <option value="Assistant Director / SSO">Assistant Director / SSO</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 15px;">Register & Create Profile</button>
        </form>

        <p class="footer-text">Already registered? <a href="employee-login.html">Employee Login</a></p>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>

    <script>
        const ALL_DESIGNATIONS = [
            "Director General (DG)",
            "Additional Director General (ADG)",
            "Deputy Director General (DDG)",
            "Director / Joint Director",
            "Deputy Director / Assistant Director",
            "Senior Statistical Officer (SSO)",
            "Junior Statistical Officer (JSO)",
            "Deputy Director General (DDG / Regional Head)",
            "Senior Statistical Officer (SSO / Field Supervisor)",
            "Junior Statistical Officer (JSO / Field Investigator)",
            "Additional Director General (ADG / Head of Academy)",
            "Director / Joint Director (Faculty)",
            "Deputy Director / Assistant Director (Course Coordinator)",
            "ISS Probationer / Officer Trainee (NSSTA)",
            "Director / Commissioner of Economics & Statistics (State Head)",
            "Joint Director / Deputy Director (State DES)",
            "Assistant Statistical Officer / Statistical Officer (State)",
            "Statistical Inspector / Research Assistant (DES)",
            "District Statistical Officer (DSO)",
            "Assistant Statistical Officer (ASO)",
            "Primary Field Investigator / Enumerator",
            "Sub-Divisional / Taluk Statistical Officer",
            "Statistical Compiler / Computer Operator",
            "Director",
            "Joint Director",
            "Deputy Director",
            "Assistant Director",
            "Senior Statistical Officer",
            "Junior Statistical Officer",
            "Assistant Director / SSO"
        ];

        const designationsMap = {
            "NAD": ["Director General (DG)", "Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Director", "Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "ESD": ["Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Director", "Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "PSD": ["Deputy Director General (DDG)", "Director / Joint Director", "Director", "Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "SSD": ["Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Director", "Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "FOD": ["Additional Director General (ADG)", "Deputy Director General (DDG / Regional Head)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO / Field Supervisor)", "Junior Statistical Officer (JSO / Field Investigator)", "Primary Field Investigator / Enumerator"],
            "SDRD": ["Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "DPD": ["Deputy Director General (DDG)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "DIID": ["Deputy Director General (DDG)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "NSSTA": ["Additional Director General (ADG / Head of Academy)", "Deputy Director General (DDG)", "Director / Joint Director (Faculty)", "Deputy Director / Assistant Director (Course Coordinator)", "ISS Probationer / Officer Trainee (NSSTA)"],
            "CAPD": ["Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "NSSO": ["Director General (NSSO / DG)", "Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "IPMD": ["Additional Director General (ADG)", "Deputy Director General (DDG)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (SSO)", "Junior Statistical Officer (JSO)"],
            "SDG_LAB": ["Deputy Director General (DDG / Lead)", "Director / Joint Director", "Deputy Director / Assistant Director", "Senior Statistical Officer (Data Analytics / GIS)", "Junior Statistical Officer (JSO)"],
            "STATE_DES": ["Director / Commissioner of Economics & Statistics (State Head)", "Joint Director / Deputy Director (State DES)", "Assistant Statistical Officer / Statistical Officer (State)", "Statistical Inspector / Research Assistant (DES)"],
            "DSO": ["District Statistical Officer (DSO)", "Assistant Statistical Officer (ASO)", "Primary Field Investigator / Enumerator"],
            "TALUK": ["Sub-Divisional / Taluk Statistical Officer", "Assistant Statistical Officer (ASO)", "Statistical Compiler / Computer Operator", "Primary Field Investigator / Enumerator"]
        };

        function handleDeptChange() {
            const deptSelect = document.getElementById('regDept');
            const desigSelect = document.getElementById('regDesignation');
            const selectedDept = deptSelect.value;
            const currentVal = desigSelect.value;
            
            desigSelect.innerHTML = '<option value="">-- Select Designation --</option>';

            const listToUse = (selectedDept && designationsMap[selectedDept]) ? designationsMap[selectedDept] : ALL_DESIGNATIONS;

            listToUse.forEach(role => {
                const opt = document.createElement('option');
                opt.value = role;
                opt.textContent = role;
                if (role === currentVal) opt.selected = true;
                desigSelect.appendChild(opt);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://sih100-backend.onrender.com';
                const res = await fetch(`${API_URL}/api/metadata`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.designations && data.designations.length > 0) {
                        data.designations.forEach(d => {
                            if (!ALL_DESIGNATIONS.includes(d)) ALL_DESIGNATIONS.push(d);
                        });
                        handleDeptChange();
                    }
                }
            } catch (e) {}
        });
    </script>
    <script src="auth.js"></script>
</body>
</html>
