<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Login | MoSPI Competency Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background-color: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 2.8rem 2.2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        .icon-box {
            font-size: 2.8rem;
            color: #234374;
            margin-bottom: 0.8rem;
        }
        h2 {
            font-size: 1.55rem;
            font-weight: 800;
            color: #234374;
            margin-bottom: 0.2rem;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s border;
        }
        input:focus {
            border-color: #234374;
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #2b4c7e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1e3a8a;
        }
        .footer-text {
            margin-top: 1.8rem;
            font-size: 0.88rem;
            color: #64748b;
        }
        .footer-text a {
            color: #2b4c7e;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-box">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>MoSPI Competency Portal</h2>
        <p class="subtitle">Officer Login</p>

        <form onsubmit="handleLogin(event, 'Officer')">
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" value="officer@gov.in" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" value="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>

        <p class="footer-text">
            New Officer? <a href="#">Register here</a>
        </p>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
    </div>

    <script>
        function handleLogin(e, role) {
            e.preventDefault();
            alert(`${role} Logged in successfully!`);
        }
    </script>
</body>
</html>
